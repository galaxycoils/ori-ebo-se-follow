<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ori · Follow demo</title>
<style>
:root {
  color-scheme: light;
  font: 16px/1.5 "Inter", system-ui, sans-serif;
  color: #243028;
  background: #edf0e9;
}
body { margin: 0; }
main { width: min(640px, calc(100% - 32px)); margin: 28px auto; }
header { position: sticky; top: 0; z-index: 1; padding: 8px 0; background: #edf0e9; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.65rem; letter-spacing: -.04em; }
.mode { font-size: .85rem; color: #4e6053; }
.card { background: #fff; border: 1px solid #d4ded4; border-radius: 16px; overflow: hidden; margin-top: 12px; }
canvas { width: 100%; height: auto; display: block; touch-action: none; background: #222; }
.controls { padding: 16px; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
button {
  min-height: 44px; padding: 7px 12px; background: #f2f6f0; color: #243028;
  border: 1px solid #c6d4c7; border-radius: 8px; font: inherit; cursor: pointer;
}
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, canvas:focus-visible { outline: 3px solid #09613c; outline-offset: 2px; }
#confirm, #follow { background: #15583b; border-color: #15583b; color: white; }
#stop { color: #fff; background: #962d35; border-color: #962d35; }
#status { margin: 0 0 12px; font-weight: 650; }
#help { margin: 12px 0 0; color: #405148; }
#motion { display: block; margin-top: 10px; font: .85rem ui-monospace, monospace; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><div><h1>Ori</h1><span class="mode">Desktop replay demo</span></div><button id="stop">Stop</button></header>
  <section class="card" aria-label="Preview and tracking controls">
    <canvas id="preview" width="320" height="180" aria-label="Demo live preview. Tap or drag to select the target."></canvas>
    <div class="controls">
      <p id="status" role="status">Waiting for the preview</p>
      <div class="actions">
        <button id="confirm" hidden>Confirm selection</button>
        <button id="cancel" hidden>Cancel selection</button>
        <button id="track">Track only</button>
        <button id="teach">Set gap here</button>
        <button id="follow">Follow</button>
        <button id="home">Return home</button>
        <button id="lift" hidden>Lift off base (demo)</button>
        <button id="move">Move demo target</button>
      </div>
      <p id="help">Tap the target to track it, or drag a box for a custom selection.</p>
      <output id="motion">Simulated motion · HOLD</output>
    </div>
  </section>
</main>
<script>
"use strict";

const canvas = document.querySelector("#preview");
const ctx = canvas.getContext("2d");
const buttons = Object.fromEntries(
  [...document.querySelectorAll("button")].map(button => [button.id, button])
);
const statusText = document.querySelector("#status");
const help = document.querySelector("#help");
const motion = document.querySelector("#motion");
const driver = crypto.getRandomValues(new Uint32Array(1))[0] || 1;
let status = { state: "OFF", owner: 0, generation: 1, motion: "HOLD", revision: 0 };
const retiredBoots = new Set();
let displayed = { frame: 0, imageFrame: 0, image: null, box: null };
let presented = null;
let selection = null;
let startPoint = null;
let lastTag = "";
let dragging = false;
let pending = "";
let fatal = "";
let hint = "";
let lastNewImage = -Infinity;
let intent = 0;
const previewIsLive = () => !fatal && !document.hidden && performance.now() - lastNewImage < 750;

const labels = {
  OFF: "Tracking off",
  TRACKING: "Track only",
  READY: "Track only · gap set",
  FOLLOWING: "Following",
  LOST: "Pet lost · select again",
};
const reasons = {
  "owner-stop": "Stopped.",
  "camera-stale": "Camera frames stopped arriving.",
  "heartbeat-expired": "The control session expired.",
  "preview-expired": "The preview stopped updating.",
  "selection-expired": "The selection expired. Tap the live target again.",
  "selection-uncertain": "That selection could not be tracked. Tap the live target again.",
};

function paint() {
  if (displayed.image) ctx.drawImage(displayed.image, 0, 0);
  const region = selection ? selection.box : displayed.box;
  if (region) {
    ctx.strokeStyle = selection ? "#ffce6e" : "#82ecab";
    ctx.lineWidth = 2;
    ctx.strokeRect(...region);
  }
}

function setText(element, value) {
  if (element.textContent !== value) element.textContent = value;
}

function update() {
  const owner = status.owner === driver;
  const dockLabels = {
    requested: "Requesting return to base",
    returning: "Returning to base",
    "checking-charge": "Checking charging contacts",
    charging: "Charging on base",
    stopping: "Waiting for docking to stop",
    failed: "Charging was not confirmed",
    unknown: "Checking base status",
  };
  const busy = (status.owner && !owner) || (status.dock_owner && status.dock_owner !== driver);
  const live = previewIsLive();
  const previewMessage = displayed.image ? "Waiting for live video" : "Connecting to preview";
  const stateLabel = busy ? "Controlled by another tab" : dockLabels[status.dock] || labels[status.state];
  const feedback = pending === "stop" ? "Stopping…" : pending === "select" ? "Selecting target…" : "";
  setText(statusText, fatal || feedback || (selection ? "Adjust selection" : !live ? previewMessage : hint || stateLabel));
  setText(motion, "Simulated motion · " + (live ? status.motion : "unknown"));
  setText(help, selection ? "Drag around the whole target, then confirm."
    : reasons[status.reason] || ({
      OFF: "Tap the target to track it, or drag a box for a custom selection.",
      LOST: "Tap the target in the live picture to select it again.",
      TRACKING: status.can_teach ? "Set the gap at the distance you want to keep." : "Hold the target steady to set the gap.",
      READY: "Gap saved. Press Follow when you want Ori to move.",
      FOLLOWING: "Track only pauses driving and keeps the target selected.",
    })[status.state]);
  buttons.confirm.hidden = buttons.cancel.hidden = !selection;
  buttons.track.hidden = !owner || Boolean(selection) || (status.state !== "FOLLOWING" && pending !== "follow");
  buttons.teach.hidden = !owner || Boolean(selection) || status.state === "FOLLOWING";
  buttons.follow.hidden = !owner || Boolean(selection) || status.state !== "READY";
  buttons.move.hidden = !owner || Boolean(selection) || status.state === "FOLLOWING";
  buttons.teach.disabled = !live || !status.can_teach || Boolean(pending);
  buttons.follow.disabled = buttons.move.disabled = !live || Boolean(pending);
  buttons.home.hidden = !status.can_home || Boolean(selection);
  buttons.home.disabled = Boolean(busy || pending) || !live;
  buttons.lift.hidden = status.dock !== "charging";
  buttons.lift.disabled = Boolean(pending) || !live;
  if (dockLabels[status.dock]) {
    const dockHelp = {
      requested: "Waiting for the factory controller.",
      returning: "The factory controller has the wheels.",
      "checking-charge": "Waiting for sustained charging feedback.",
      charging: "Lift Ori off the simulated base to start another session.",
      stopping: "Waiting for the controller to report idle.",
      failed: "Clear the approach and place Ori within 2 m in front of the base before retrying.",
      unknown: "Waiting for fresh factory feedback.",
    };
    setText(help, dockHelp[status.dock]);
  }
  buttons.stop.disabled = Boolean(busy);

}

function apply(next) {
  if (retiredBoots.has(next.boot)) return;
  if (next.boot === status.boot && next.revision < status.revision) return;
  if (status.boot && next.boot !== status.boot) {
    retiredBoots.add(status.boot);
    selection = null;
    if (presented?.image !== displayed.image) presented?.image.close();
    presented = null;
    displayed.frame = 0;
    displayed.box = null;
    hint = "";
  }
  if (selection && (selection.session.boot !== next.boot || selection.session.generation !== next.generation)) {
    selection = null;
    startPoint = null;
  }
  status = next;
  update();
}

const transport = document.documentElement.dataset.preview === "pages"
  ? import("./simulator.mjs").then(module => module.createSimulator())
  : Promise.resolve({
    async frame(previous) {
      const response = await fetch("/api/frame", {
        cache: "no-store", headers: {"If-None-Match": previous}, signal: AbortSignal.timeout(1200),
      });
      if (response.status === 204) return null;
      if (!response.ok) throw new Error("Preview unavailable");
      return {
        tag: response.headers.get("ETag") || "",
        frame: Number(response.headers.get("X-Frame-Id")),
        status: JSON.parse(response.headers.get("X-Ori-Status")),
        image: async () => createImageBitmap(await response.blob()),
        discard: () => response.body.cancel(),
      };
    },
    async control(action, payload) {
      const response = await fetch("/api/" + action, {
        signal: AbortSignal.timeout(2000),
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error("Control request failed");
      return response.json();
    },
  });

async function post(action, fields = {}, session = status) {
  const result = await (await transport).control(action, {
    driver, boot: session.boot, generation: session.generation, ...fields,
  });
  apply(result);
  return result.accepted;
}

async function refresh() {
  if (document.hidden) {
    setTimeout(refresh, 200);
    return;
  }
  try {
    const preview = await (await transport).frame(lastTag);
    if (!preview) return;
    lastTag = preview.tag;
    const {frame, status: next} = preview;
    if (retiredBoots.has(next.boot)) {
      await preview.discard();
      return;
    }
    if (status.boot && next.boot !== status.boot) apply(next);
    if (selection && (frame - selection.frame >= 20 || performance.now() >= selection.deadline)) {
      selection = null;
      startPoint = null;
      hint = "Selection expired. Tap the live picture to try again.";
    }
    if (frame !== displayed.imageFrame || displayed.boot !== next.boot) {
      if (selection) {
        await preview.discard();
        apply(next);
        return;
      }
      const image = await preview.image();
      if (!selection && !document.hidden && !retiredBoots.has(next.boot)) {
        // Acknowledge after a rendering opportunity, using the painted frame ID.
        const previous = displayed.image;
        lastNewImage = performance.now();
        displayed.boot = next.boot;
        displayed.image = image;
        displayed.imageFrame = frame;
        displayed.box = next.generation >= status.generation ? next.box : null;
        paint();
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (!selection && !document.hidden && displayed.image === image) {
            if (presented?.image !== image) presented?.image.close();
            displayed.frame = frame;
            presented = {...displayed};
          }
        }));
        if (previous !== presented?.image) previous?.close();
      } else {
        image.close();
      }
    } else {
      await preview.discard();
    }
    fatal = "";
    apply(next);
  } catch {
    fatal = "Preview unavailable";
    update();
  } finally {
    setTimeout(refresh, fatal ? 180 : 0);
  }
}

function point(event) {
  const bounds = canvas.getBoundingClientRect();
  return [
    Math.min(319, Math.max(1, (event.clientX - bounds.left) * 320 / bounds.width)),
    Math.min(179, Math.max(1, (event.clientY - bounds.top) * 180 / bounds.height)),
  ];
}

canvas.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0 || pending || (!selection && !previewIsLive()) ||
      !presented || presented.boot !== status.boot || (status.owner && status.owner !== driver)
      || status.state === "FOLLOWING" || (status.dock !== "idle" && !status.can_home)) return;
  // An image drawn since the last rendering opportunity may still be pending.
  if (displayed.image !== presented.image) {
    displayed.image?.close();
    displayed = {...presented};
  }
  dragging = Boolean(selection);
  startPoint = point(event);
  selection = {frame: displayed.imageFrame, session: status, deadline: selection?.deadline ?? performance.now() + 2000, box: [
    Math.min(239, Math.max(1, startPoint[0] - 40)),
    Math.min(99, Math.max(1, startPoint[1] - 40)),
    80, 80,
  ]};
  hint = "";
  canvas.setPointerCapture(event.pointerId);
  paint();
  update();
});

canvas.addEventListener("pointermove", event => {
  if (!event.isPrimary || !startPoint || !selection) return;
  const end = point(event);
  const width = Math.abs(end[0] - startPoint[0]);
  const height = Math.abs(end[1] - startPoint[1]);
  if (Math.max(width, height) >= 8) dragging = true;
  if (width < 12 || height < 12) return;
  selection.box = [Math.min(end[0], startPoint[0]), Math.min(end[1], startPoint[1]), width, height];
  paint();
});
canvas.addEventListener("pointerup", event => {
  if (!event.isPrimary || !startPoint) return;
  startPoint = null;
  if (selection && !dragging) confirmSelection();
});
canvas.addEventListener("pointercancel", event => {
  if (!event.isPrimary) return;
  startPoint = selection = null;
  update();
  paint();
});

async function command(action, fields = {}, session = status) {
  if (pending && action !== "stop" && action !== "track") return;
  const currentIntent = ++intent;
  pending = action;
  update();
  hint = "";
  try {
    if (action === "follow" && displayed.frame) {
      if (!await post("heartbeat", {frame: displayed.frame}, session)) throw new Error("Preview expired");
    }
    if (intent !== currentIntent) return;
    if (!await post(action, fields, session)) {
      if (intent !== currentIntent) return;
      hint = action === "teach" ? "Hold the target steady and try again."
        : action === "select" ? "Select a fresh frame and try again."
        : "Action unavailable. Check the preview and current state.";
    }
  } catch (error) {
    if (intent !== currentIntent) return;
    hint = error.message || "Control connection unavailable";
  } finally {
    if (intent === currentIntent) pending = "";
    update();
  }
}

function confirmSelection() {
  if (!selection) return;
  const {frame, box, session} = selection;
  selection = null;
  command("select", {frame, box: box.map((value, index) => value / (index % 2 ? 180 : 320))}, session);
}
buttons.confirm.onclick = confirmSelection;
buttons.cancel.onclick = () => { selection = null; update(); paint(); };
buttons.stop.onclick = () => { selection = null; command("stop"); };
for (const action of ["track", "teach", "follow", "move", "home", "lift"]) {
  buttons[action].onclick = () => command(action);
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) displayed.frame = 0;
});

setInterval(() => {
  update();
  if (!document.hidden && displayed.frame && status.owner === driver) {
    post("heartbeat", {frame: displayed.frame}).catch(() => {});
  }
}, 250);

refresh();
update();
</script>
</body>
</html>
